<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
    .wrap {
      position: relative;
      width: 100%;
      height: 100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .fruit-img {
      max-height:90vh;
      max-width:90vw;
      display:block;
    }
    .hotspot {
      position: absolute;
      background: transparent;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="wrap">
  <img class="fruit-img" src="/img/fruit.png" alt="果子插画">

  <a class="hotspot"
     href="http://localhost:4000/2022/01/04/hello-world/"
     style="top: 70%; left: 48%; width:5%; height:7%;"></a>

<a class="hotspot"
     href="http://localhost:4000/2026/09/25/%E6%88%91%E7%9A%84%E7%AC%AC%E4%B8%80%E7%AF%87%E5%8D%9A%E5%AE%A2/"
     style="top: 65%; left: 46%; width:5%; height:7%;"></a>

</div>
</body>
</html>
